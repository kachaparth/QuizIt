name: Deploy QuizIt Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_KP }}
          username: ${{ secrets.EC2_USER_KP }}
          key: ${{ secrets.EC2_SSH_KEY_KP }}
          script: |
            cd /home/ubuntu/QuizIt
            echo "Pulling latest code..."
            git pull origin main

            cd backend

            echo "Freeing port 8080 if occupied..."
            sudo fuser -k 8080/tcp || true

            echo "Stopping old containers..."
            docker compose down || true

            echo "Rebuilding backend with fresh cache..."
            docker compose build --no-cache

            echo "Starting updated backend..."
            docker compose up -d --force-recreate

            echo "Cleaning unused Docker images..."
            docker image prune -af

            echo "Deployment completed successfully!"
